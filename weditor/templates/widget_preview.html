<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{id}} Widget</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 16px; }
        .box { display: flex; gap: 12px; align-items: flex-start; }
        pre { white-space: pre-wrap; word-wrap: break-word; border: 1px solid gray; padding: 8px; max-width: 800px; }
        .image-container > img { padding: 2px; border: 1px solid red; }
    </style>
</head>

<body>
    <div>
        <div><strong>ID:</strong> <span id="widget-id"></span>
            <a id="hierarchy-link" href="#">hierarchy</a>
        </div>
        <hr>
        <div class="box">
            <div class="image-container"><img id="template-img" height="100"></div>
            <div class="image-container"><img id="screenshot-img" height="500"></div>
            <div><pre id="meta-json"></pre></div>
        </div>
    </div>
    <script>
        (function () {
            const id = "{{id}}";
            const base = location.pathname.replace(/\/$/, "");
            document.getElementById("widget-id").textContent = id;
            document.getElementById("hierarchy-link").href = base + "/hierarchy.xml";
            document.getElementById("template-img").src = base + "/template.jpg";
            document.getElementById("screenshot-img").src = base + "/screenshot.jpg";
            fetch(base + "/meta.json")
                .then(r => r.json())
                .then(ret => {
                    document.getElementById("meta-json").textContent = JSON.stringify(ret, null, 4);
                })
                .catch(e => {
                    document.getElementById("meta-json").textContent = "load meta.json failed: " + e;
                });
        })();
    </script>
</body>

</html>
